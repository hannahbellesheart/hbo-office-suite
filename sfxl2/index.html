<!DOCTYPE html>
<html lang="en">
<head>
  <title>Spreadsheet Studio</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="description" content="Full-featured spreadsheet editor powered by Syncfusion EJ2." />

  <!-- Preconnect for faster CDN DNS resolution -->
  <link rel="preconnect" href="https://cdn.syncfusion.com" crossorigin />

  <!-- Syncfusion Fluent 2 theme (Office-365 / Windows-11 aesthetic) -->
  <link rel="stylesheet" href="https://cdn.syncfusion.com/ej2/26.2.11/fluent2.css" />

  <!-- App chrome styles -->
  <link rel="stylesheet" href="./styles/styles.css" />
</head>
<body>

  <!-- ────────────────── Loading overlay ────────────────── -->
  <div id="loader" class="loader-overlay" role="status" aria-label="Loading application">
    <div class="loader-card">
      <svg class="loader-logo" viewBox="0 0 36 36" fill="none" aria-hidden="true">
        <rect width="36" height="36" rx="8" fill="#16a34a"/>
        <rect x="8"  y="8"  width="8" height="8"  fill="#fff" opacity=".9"/>
        <rect x="20" y="8"  width="8" height="8"  fill="#fff" opacity=".9"/>
        <rect x="8"  y="20" width="8" height="8"  fill="#fff" opacity=".6"/>
        <rect x="20" y="20" width="8" height="8"  fill="#fff" opacity=".6"/>
      </svg>
      <span class="loader-name">Spreadsheet Studio</span>
      <div class="loader-bar"><div class="loader-bar-fill"></div></div>
      <span class="loader-hint">Loading Syncfusion EJ2…</span>
    </div>
  </div>

  <!-- ────────────────── App shell ────────────────── -->
  <div class="app-frame" id="appFrame">

    <!-- Title bar -->
    <header class="title-bar" role="banner">

      <div class="tb-brand">
        <svg class="tb-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <rect width="20" height="20" rx="4" fill="#16a34a"/>
          <rect x="3" y="3" width="6" height="6" fill="#fff" opacity=".9"/>
          <rect x="11" y="3" width="6" height="6" fill="#fff" opacity=".9"/>
          <rect x="3" y="11" width="6" height="6" fill="#fff" opacity=".55"/>
          <rect x="11" y="11" width="6" height="6" fill="#fff" opacity=".55"/>
        </svg>
        <span class="tb-app-name">Spreadsheet Studio</span>
      </div>

      <div class="tb-doc">
        <input
          id="docName"
          class="tb-doc-name"
          type="text"
          value="Untitled spreadsheet"
          spellcheck="false"
          aria-label="Document name"
          maxlength="80"
        />
        <span class="tb-unsaved" id="tbUnsaved" hidden aria-label="Unsaved changes">●</span>
      </div>

      <nav class="tb-actions" aria-label="File actions">
        <!-- hidden file input, triggered by the Open button -->
        <input id="fileInput" type="file" accept=".xlsx,.xls,.csv" style="display:none" aria-hidden="true" />

        <button class="tb-btn" id="newBtn" type="button" title="New spreadsheet (Ctrl+N)">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 2h7l3 3v9a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.3"/>
            <path d="M10 2v4h4" stroke="currentColor" stroke-width="1.3"/>
            <path d="M8 7v4M6 9h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          New
        </button>

        <button class="tb-btn" id="openBtn" type="button" title="Open file (Ctrl+O)">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M1.5 5.5A1.5 1.5 0 013 4h3.5l1.5 1.5H13A1.5 1.5 0 0114.5 7v6A1.5 1.5 0 0113 14.5H3A1.5 1.5 0 011.5 13V5.5z" stroke="currentColor" stroke-width="1.3"/>
          </svg>
          Open
        </button>

        <div class="tb-sep" role="separator" aria-hidden="true"></div>

        <button class="tb-btn tb-btn-primary" id="exportXlsxBtn" type="button" title="Download as XLSX">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 1v9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M5 7l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12v1a1 1 0 001 1h10a1 1 0 001-1v-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          Export XLSX
        </button>

        <button class="tb-btn" id="exportCsvBtn" type="button" title="Download active sheet as CSV">
          CSV
        </button>
      </nav>
    </header>

    <!-- Syncfusion Spreadsheet mount (ribbon, formula bar, grid, sheet tabs are all inside) -->
    <main id="spreadsheet" aria-label="Spreadsheet editor"></main>

  </div><!-- /app-frame -->

  <!-- Syncfusion EJ2 full bundle — loaded last for maximum paint speed -->
  <script src="https://cdn.syncfusion.com/ej2/26.2.11/dist/ej2.min.js"></script>
  <script src="./app/app.js"></script>
</body>
</html>
